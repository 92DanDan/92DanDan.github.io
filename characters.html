<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>角色页</title>
  <style>
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: #f7dada;
      padding: 10px;
      text-align: center;
    }
    .nav-item {
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
      color: #333;
    }
    .character-container {
      margin-top: 100px;
      display: flex;
      justify-content: center;
      gap: 50px;
      flex-wrap: wrap;
    }
    .character-card {
      background: #fff3f3;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      width: 280px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .character-card img {
      max-width: 100%;
      border-radius: 12px;
    }
    .currency {
      margin-top: 10px;
      font-size: 16px;
      text-align: left;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-item">主页</a>
    <a href="pet.html" class="nav-item">宠物页</a>
    <a href="treasure.html" class="nav-item">藏宝页</a>
    <a href="characters.html" class="nav-item">角色页</a>
  </nav>

  <div class="character-container" id="characterContainer"></div>

  <script>
    async function loadCharacters() {
      const response = await fetch("http://localhost:3000/api/characters");
      const data = await response.json();

      const container = document.getElementById("characterContainer");
      container.innerHTML = "";

      for (const id in data) {
        const char = data[id];
        container.innerHTML += `
          <div class="character-card">
            <img src="character${id}.jpg" alt="${char.name}">
            <h2>${char.name}</h2>
            <div class="currency">
              <div>🥉 铜币: ${char.bronze}</div>
              <div>🥈 银币: ${char.silver}</div>
              <div>🪙 金币: ${char.gold}</div>
              <div>💎 钻石: ${char.diamond}</div>
            </div>
          </div>`;
      }
    }

    loadCharacters();
  </script>
</body>
</html>
