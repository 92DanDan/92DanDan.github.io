<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>角色页</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .character-container {
      margin-top: 100px;
      display: flex;
      justify-content: center;
      gap: 50px;
      flex-wrap: wrap;
    }

    .character-card {
      background: #fff3f3;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      width: 280px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .character-card img {
      max-width: 100%;
      border-radius: 12px;
    }

    .currency {
      margin-top: 10px;
      font-size: 16px;
      text-align: left;
    }

    .currency span {
      display: block;
      margin: 5px 0;
    }

    .currency-icon {
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-item">主页</a>
    <a href="pet.html" class="nav-item">宠物页</a>
    <a href="treasure.html" class="nav-item">藏宝页</a>
    <a href="characters.html" class="nav-item">角色页</a>
  </nav>

  <div class="character-container">
    <!-- 土司小咩 -->
    <div class="character-card">
      <img src="character1.png" alt="土司小咩">
      <h2>土司小咩</h2>
      <div class="currency">
        <span>🥉 铜币: <strong>0</strong></span>
        <span>🥈 银币: <strong>0</strong></span>
        <span>🪙 金币: <strong>0</strong></span>
        <span>💎 钻石: <strong>0</strong></span>
      </div>
    </div>

    <!-- 荷包小单 -->
    <div class="character-card">
      <img src="character2.png" alt="荷包小蛋">
      <h2>荷包小蛋</h2>
      <div class="currency">
        <span>🥉 铜币: <strong>1</strong></span>
        <span>🥈 银币: <strong>0</strong></span>
        <span>🪙 金币: <strong>0</strong></span>
        <span>💎 钻石: <strong>0</strong></span>
      </div>
    </div>
  </div>
</body>
</html>
