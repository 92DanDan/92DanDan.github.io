<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>佳炜与纯的主页</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>欢迎来到倪佳炜与杨纯的主页 ❤️</h1>
    <p id="greeting"></p>
    
    <!-- 纪念日跳转按钮 -->
    <div style="text-align: center; margin-top: 20px;">
      <a href="countdown.html" class="btn">查看纯蛋的纪念日倒计时</a>
    </div>
    
    <!-- 照片墙跳转按钮 -->
    <div style="text-align: center; margin-top: 20px;">
      <a href="countdown.html" class="btn">查看我们的纪念日倒计时</a>
      <a href="photowall.html" class="btn" style="margin-left: 10px;">打开纯蛋的照片墙</a>
    </div>

    
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      let username = prompt("您的用户名是:");
      if (!username) username = "匿名用户";

      const greeting = document.getElementById("greeting");
      greeting.textContent = `您好，${username}！很高兴您来访。`;
    });
  </script>
</body>
</html>
